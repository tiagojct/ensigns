<article class="sp-log">
  <h5 class="sp-title">Log, the middle watch</h5>
  <nav class="sp-tabs" aria-label="Log sections">
    <a href="#sp-entry-{mode}" aria-current="page">Entry</a>
    <a href="#sp-entry-{mode}">Crew</a>
    <a href="#sp-entry-{mode}">Chart</a>
  </nav>
  <p class="prose" id="sp-entry-{mode}">Wind steady from the west, the try-works cold, all hands on deck at four bells.</p>
  <ul class="sp-statuses">
    <li data-status="success"><svg class="sp-icon" viewBox="0 0 16 16" aria-hidden="true"><path class="sp-ok" d="M2 8l4 4 8-8"/></svg> Course held</li>
    <li data-status="warning"><svg class="sp-icon" viewBox="0 0 16 16" aria-hidden="true"><path class="sp-warn" d="M8 2l7 12H1z"/></svg> Squall to the east</li>
  </ul>
  <svg class="sp-chart" viewBox="0 0 120 48" role="img" aria-label="Barrels of oil by week: three, five and two">
    <rect class="sp-bar-1" x="4" y="24" width="32" height="24"/>
    <rect class="sp-bar-2" x="44" y="8" width="32" height="40"/>
    <rect class="sp-bar-3" x="84" y="32" width="32" height="16"/>
  </svg>
</article>
