<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="14">
  <rect width="720" height="360" rx="8" fill="#10161c"/>
  <rect width="720" height="30" rx="8" fill="#171f26"/>
  <text x="20" y="20" fill="#c3cdd3" font-size="12">bloom.R — Glauca Dark</text>
  <g xml:space="preserve">
    <text x="24" y="62" fill="#8c8c8c" font-style="italic"># One accent per plot; the palette is Okabe-Ito.</text>
    <text x="24" y="88"><tspan fill="#4a9edb">library</tspan><tspan fill="#86929a">(</tspan><tspan fill="#e8eef2">ggplot2</tspan><tspan fill="#86929a">)</tspan></text>
    <text x="24" y="114"><tspan fill="#4a9edb">source</tspan><tspan fill="#86929a">(</tspan><tspan fill="#62ba46">"glauca.R"</tspan><tspan fill="#86929a">)</tspan></text>
    <text x="24" y="166"><tspan fill="#e8eef2">plot_bloom </tspan><tspan fill="#a7b1b8">&lt;-</tspan><tspan fill="#e8eef2"> </tspan><tspan fill="#007aff" font-weight="700">function</tspan><tspan fill="#86929a">(</tspan><tspan fill="#c3cdd3">df</tspan><tspan fill="#86929a">, </tspan><tspan fill="#c3cdd3">n</tspan><tspan fill="#a7b1b8"> = </tspan><tspan fill="#b184db" font-style="italic">7</tspan><tspan fill="#86929a">) {</tspan></text>
    <text x="52" y="192"><tspan fill="#4a9edb">ggplot</tspan><tspan fill="#86929a">(</tspan><tspan fill="#e8eef2">df</tspan><tspan fill="#86929a">, </tspan><tspan fill="#4a9edb">aes</tspan><tspan fill="#86929a">(</tspan><tspan fill="#e8eef2">x</tspan><tspan fill="#86929a">, </tspan><tspan fill="#e8eef2">y</tspan><tspan fill="#86929a">, </tspan><tspan fill="#c3cdd3">colour</tspan><tspan fill="#a7b1b8"> = </tspan><tspan fill="#e8eef2">group</tspan><tspan fill="#86929a">)) +</tspan></text>
    <text x="52" y="218"><tspan fill="#4a9edb">geom_point</tspan><tspan fill="#86929a">(</tspan><tspan fill="#c3cdd3">size</tspan><tspan fill="#a7b1b8"> = </tspan><tspan fill="#b184db" font-style="italic">2</tspan><tspan fill="#86929a">) +</tspan></text>
    <text x="52" y="244"><tspan fill="#4a9edb">scale_colour_glauca_d</tspan><tspan fill="#86929a">() +</tspan></text>
    <text x="52" y="270"><tspan fill="#4a9edb">theme_glauca</tspan><tspan fill="#86929a">(</tspan><tspan fill="#c3cdd3">mode</tspan><tspan fill="#a7b1b8"> = </tspan><tspan fill="#62ba46">"light"</tspan><tspan fill="#86929a">)</tspan></text>
    <text x="24" y="296" fill="#86929a">}</text>
  </g>
  <rect x="0" y="330" width="720" height="30" fill="#171f26"/>
  <text x="20" y="350" fill="#8c8c8c" font-size="12">main</text>
  <text x="700" y="350" text-anchor="end" fill="#8c8c8c" font-size="12">R · UTF-8</text>
</svg>
