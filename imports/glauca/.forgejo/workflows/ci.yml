name: ci
on: [push, pull_request]

# Forgejo Actions workflow (runs when the instance has Actions enabled and a
# runner registered). Actions pinned to commit SHAs for supply-chain safety;
# the tag is in the comment. Bump them by hand when updating.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.x"
      - name: Install fontTools (glyph-coverage check needs it)
        run: pip install fonttools
      - name: Validate tokens, contrast, roles, scales
        run: python3 src/scripts/validate.py
      - name: Check generated files are in sync with the json
        run: python3 src/scripts/generate.py --check
      - name: Colour-vision report
        run: python3 src/scripts/cvd_check.py
      - name: Portuguese coverage and subset range
        run: python3 src/scripts/check_fonts.py
      - name: Tailwind preset parses as JavaScript
        run: node --check dist/tailwind/colors.generated.js && node -e "require('./dist/tailwind')"
