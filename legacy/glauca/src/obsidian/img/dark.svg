<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="IBM Plex Sans, system-ui, sans-serif">
  <rect width="640" height="400" rx="10" fill="#10161c"/>
  <rect width="180" height="400" fill="#10161c"/>
  <line x1="180" y1="0" x2="180" y2="400" stroke="#2a3540"/>
  <g font-size="13" fill="#8c8c8c">
    <text x="20" y="40">Notes</text>
    <text x="20" y="68" fill="#e8eef2">Glaucous bloom</text>
    <rect x="12" y="52" width="156" height="24" rx="4" fill="#4d739133"/>
    <text x="20" y="96">Frost field</text>
    <text x="20" y="124">One blue mark</text>
  </g>
  <g>
    <text x="212" y="56" font-size="26" font-weight="600" fill="#e8eef2">Glaucous bloom</text>
    <text x="212" y="92" font-size="15" fill="#e8eef2">The pale film on leaves, waves and eyes. Nothing hides</text>
    <text x="212" y="114" font-size="15" fill="#e8eef2">behind the surface; the bloom carries the substance,</text>
    <text x="212" y="136" font-size="15"><tspan fill="#e8eef2">and the </tspan><tspan fill="#3d97ff">sky-blue mark</tspan><tspan fill="#e8eef2"> is kept rare.</tspan></text>
    <text x="212" y="170" font-size="15" font-family="IBM Plex Serif, Georgia, serif" font-style="italic" fill="#e8eef2">Emphasis answers in serif italic.</text>
    <rect x="212" y="192" width="380" height="54" rx="6" fill="#4a9edb1a"/>
    <rect x="212" y="192" width="4" height="54" fill="#4a9edb"/>
    <text x="230" y="215" font-size="13" font-weight="600" fill="#4a9edb">Info</text>
    <text x="230" y="235" font-size="13" fill="#e8eef2">Everyday callouts use the working blue, lacus.</text>
    <g font-size="13">
      <rect x="212" y="266" width="70" height="22" rx="11" fill="#62ba461f"/>
      <text x="226" y="281" fill="#62ba46">#bloom</text>
      <rect x="290" y="266" width="60" height="22" rx="11" fill="#62ba461f"/>
      <text x="304" y="281" fill="#62ba46">#frost</text>
    </g>
    <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">
      <rect x="212" y="306" width="380" height="52" rx="6" fill="#171f26"/>
      <text x="228" y="328"><tspan fill="#007aff" font-weight="700">def</tspan><tspan fill="#4a9edb"> bloom</tspan><tspan fill="#86929a">():</tspan></text>
      <text x="228" y="348"><tspan fill="#007aff" font-weight="700">    return</tspan><tspan fill="#62ba46"> "one rare mark"</tspan></text>
    </g>
  </g>
</svg>
