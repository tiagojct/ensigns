server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx sits behind cloudflared and Caddy and only sees plain HTTP. Keep redirects
    # relative, so that they never say http://.
    absolute_redirect off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/x-lua text/x-r text/x-python text/yaml application/toml;

    # A location that sets its own add_header loses every add_header of the server level, so
    # no location below sets one. Caching goes through expires, which has no such effect.
    # tests/site/deploy.test.ts keeps it that way.

    # Hashed build output: cache for a year.
    location ^~ /assets/ { expires 1y; }
    # Fonts change rarely and have no hash in the name.
    location ^~ /fonts/ { expires 30d; }
    location ^~ /exports/ { default_type text/plain; }
    location ^~ /releases/ { default_type application/octet-stream; }
    location = /glauca/ { return 301 /goney/; }
    location = /try-works/ { return 301 /jungfrau/; }
    location = /ambergris/ { return 301 /rosebud/; }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
    error_page 404 /404/index.html;
}
