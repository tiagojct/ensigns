# Ensigns: static site (nginx) behind Caddy on the proxy network, the same shape as
# /opt/vps/apps/loomings. Put this file in /opt/vps/apps/ensigns/. The image is built
# and pushed by .github/workflows/build-deploy.yml, which the owner starts by hand.
# :latest moves when that workflow runs, and the one watchtower already on the box
# redeploys within five minutes. Do not add a second watchtower service here.
#
# nginx runs unprivileged on 8080 inside the proxy network. Caddy reaches it there,
# so no port is published on the host.
services:
  ensigns:
    image: ghcr.io/tiagojct/ensigns:latest
    container_name: ensigns
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "true"

networks:
  proxy:
    external: true
