services:
  ensigns:
    image: ensigns:local
    build:
      context: ../..
      dockerfile: site/deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
